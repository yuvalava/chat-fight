# fly launch --copy-config --no-deploy   (then set secrets, then fly deploy)
app = "chat-fight"
primary_region = "fra"

[build]

[env]
  PORT = "3000"
  SNAPSHOT_FILE = "/data/fights.snapshot.json"
  JUDGE_MODEL = "claude-sonnet-5-5"

[http_service]
  internal_port = 3000
  force_https = true
  # Fights live in memory and wait_for_turn holds connections open: keep one machine up.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[[http_service.checks]]
  interval = "30s"
  timeout = "5s"
  grace_period = "10s"
  method = "GET"
  path = "/healthz"

[mounts]
  source = "chat_fight_data"
  destination = "/data"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
